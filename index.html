<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 캔버스 편집 중 브라우저 확대와 노치 여백 개입을 막는다 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#131313" />
    <!-- 홈 화면에 추가했을 때 주소창 없이 열린다. 앞의 것은 안드로이드, 뒤의 둘은 아이폰용이다 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inkku" />
    <!-- 사파리가 날짜나 숫자를 전화번호 링크로 바꿔 파랗게 칠하지 않게 한다 -->
    <meta name="format-detection" content="telephone=no" />
    <!-- 아이콘이 없으면 브라우저가 /favicon.ico를 찾다가 404를 남긴다 -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      설치형 앱으로 띄우기 위한 매니페스트.
      오프라인 캐시(서비스 워커)는 아직 없다. vite-plugin-pwa를 넣을지 정해야 한다.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      UI 폰트. 라틴과 숫자만 이 폰트를 타고 한글은 시스템 폰트로 떨어진다.
      preconnect를 먼저 걸어야 폰트 요청이 DNS부터 시작하지 않는다.

      media=print로 걸었다가 로드된 뒤 all로 바꾸는 것은 렌더를 막지 않기 위해서다.
      보통의 stylesheet 링크는 응답이 올 때까지 첫 화면을 붙잡는데,
      네트워크가 느린 지하철에서 글꼴 하나 때문에 흰 화면을 몇 초씩 보여 줄 수는 없다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <title>Inkku</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
