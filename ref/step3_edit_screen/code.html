<script>
  (function() {
    // Tactile micro-drag simulation for active sticker
    const sticker = document.getElementById('activeSticker');
    if (!sticker) return;

    let isDragging = false;
    let startX, startY;
    let currentX = 0;
    let currentY = 0;

    const onPointerDown = (e) => {
      isDragging = true;
      startX = e.clientX || (e.touches && e.touches[0].clientX);
      startY = e.clientY || (e.touches && e.touches[0].clientY);
      sticker.style.transition = 'none';
    };

    const onPointerMove = (e) => {
      if (!isDragging) return;
      const x = e.clientX || (e.touches && e.touches[0].clientX);
      const y = e.clientY || (e.touches && e.touches[0].clientY);
      const dx = x - startX;
      const dy = y - startY;

      sticker.style.transform = `translate(${currentX + dx}px, ${currentY + dy}px)`;
    };

    const onPointerUp = (e) => {
      if (!isDragging) return;
      isDragging = false;
      const x = e.clientX || (e.changedTouches && e.changedTouches[0].clientX) || startX;
      const y = e.clientY || (e.changedTouches && e.changedTouches[0].clientY) || startY;
      currentX += (x - startX);
      currentY += (y - startY);
      sticker.style.transition = 'transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1)';
    };

    sticker.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    sticker.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    // Export button tactile bounce & visual confirmation
    const exportBtn = document.getElementById('exportBtn');
    if (exportBtn) {
      exportBtn.addEventListener('click', () => {
        exportBtn.classList.add('scale-90');
        setTimeout(() => exportBtn.classList.remove('scale-90'), 150);
      });
    }
  })();
</script></main></body></html>
